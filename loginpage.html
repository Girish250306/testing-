<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body{
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
      flex-direction: column;
      margin: 0px;
      padding: 0px;
      z-index: 99;
    }
    .background-image{
      background-image: url("login page.png");
      background-repeat: no-repeat;
      background-size: cover;
      width: 1920px;
      height: 100vh;
      position: fixed;
    }
    
    .maindiv{
      border: 1px solid  black;
      padding: 60px;
      border-radius: 8px;
      height: 420px;
      width: 420px;
      display: flex;
      justify-self: center;
      flex-direction: column;
      align-items: center;
      background: transparent;
      backdrop-filter: blur(10px);
    }
    .input1{
      margin-top: 0px;
      height: 30px;
      width: 300px;
      font-family: sans-serif;
      border-radius: 8px;
      font-size: large;
      border:1px solid #ccc ;
      padding: 10px;
      position: relative;
      
    }
    .input2{
      margin-top: 0px;
      height: 30px;
      width: 300px;
      font-family: sans-serif;
      border-radius: 8px;
      font-size: large;
      border:1px solid black ;
      position: relative;
      border:1px solid #ccc ;
      padding: 10px;
    }
    .name{
      margin-bottom: 8px;
      margin-left: 10px;
      font-family: sans-serif;
      color:#E5E6E1;
    }
    
    .btn{
      margin-top: 14px;
      padding: 10px;
      margin-top: 30px;
      height: 40px;
      width: 140px;
      background-color: rgb(5, 137, 239);
      border-radius: 16px;
      font-size: large;
    }
    .btn:hover{
      background-color: cyan;
      opacity: 0.8;
    }
    .btn:active{
      background-color:rgb(5, 137, 239);
      color:black ;
    }
   .result{
    color: red;
    font-family: sans-serif;
    font-size: 20px;
  
   }
   .h1{
    color:#E5E6E1;
   }
   .person1{
    height: 30px;
    width: 60px;
    right: 105px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 215px;
   }
   .person2{
    height: 30px;
    width: 60px;
    right: 105px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 315px;
   }
   .forgot-password{
    display: flex;
    flex-direction: row;
    column-gap: 20px;
    color: white;
    margin-top: 20px;
    font-family: sans-serif;
    font-size: 18px;
   }
   .password{
    text-decoration: none;
    color: rgb(0, 131, 212);
   }
   .password:hover{
    text-decoration: underline;
   }
   .hr{
    height: 4px;
    width: 400px;
    color:#E5E6E1;
   }
   .topic,.break{
    display: flex;
    justify-content: center;
    color:#E5E6E1;
   }
    
  </style>
</head>

<body>
  
  <div class="background-image">
     <h1 class="topic">AI&nbsp;&nbsp;POWERED&nbsp;&nbsp;VEHICLE&nbsp;&nbsp;DETECTION&nbsp;&nbsp;FOR <br >&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;PARKING&nbsp;&nbsp;ALLOCTION</h1>
  </div>
 
  <div class="maindiv">
    
    <h1 class="h1">Login</h1>
    <hr class="hr">
    
    <div class="position1">
      <h3 class="name">username</h3>
      <input class="input1" type="text" placeholder="Enter username"> 
      <img src="person.svg" class="person1">
    </div>
    <div class="position2">
      <h3 class="name">password</h3>
      <input class="input2" type="password" placeholder="Enter password" onkeydown="enter(event)">
       <img src="lock-closed.svg" class="person2">
    </div>
    <div class="forgot-password">
      <label><input type="checkbox" >Remember me</label>
      
      <a href="#" class="password">Forgot Password?</a>
    </div>
    <button class="btn" onclick="login()">Login</button>
    <p class="result"></p>
  </div>
  
  <script>
    function login(){
      let username=document.querySelector(".input1").value;
      let userpassword=document.querySelector(".input2").value;
      const correct_name="Girish";
      const correct_password="girish@2006";
      if(correct_name===username && correct_password===userpassword){
        window.location.href="camra-table.html"
      }
      else{
        document.querySelector(".result").innerHTML=`Invalid Username or password`;
      }
    }
    function enter(event){
      if(event.key ==="Enter"){
        login();
      }
    }

  </script>
</body>
</html>
