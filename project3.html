<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login_Page</title>
  <style>
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0px;
      padding: 0px;
      z-index: 99;
    
    
  }
    header{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px 30px;
      
      display: flex;
      flex-direction: row;
      align-items: center;
      z-index: 99;
    }
    .logo{
      font-size: 2em;
      color: white;
      user-select: none;
      margin-left: 0px;
    }
    .navigation{
      margin-left: 1080px;
      font-size: 30px;
    }
    .navigation a{
      position: relative;
      font-size: 1.1em;
      color: white;
      text-decoration: none;
      font-weight: 500;
      margin-left: 40px;
    }
     .background-image{
      background-image: url("Gemini_Generated_Image_41yw4x41yw4x41yw.png");
      background-repeat: no-repeat;
      background-size: cover;
      width: 1920px;
      height: 100vh;
      position: fixed;
    }
    .navigation button{
      width: 100px;
      height: 40px;
      margin-left: 20px;
      background: transparent;
      cursor: pointer;
      color: white;
      border-radius: 4px;
      font-size: 1.1em;
      font-weight: 500;
      transition: 0.5s;
      border: 2px solid white;
    }
    .navigation button:hover{
      background-color: white;
      color: red;
    }
    .navigation a::after{
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 3px;
      background: white;
      border-radius: 5px;
      transform-origin: right;
      transform: scaleX(0);
      transition:transform .5s;
    }
    .navigation a:hover::after{
      transform: scaleX(1);
      transform-origin: left;
    }
  </style>
</head>
<body>
  <div class="background-image"></div>
  <header>
    <h2 class="logo">Logo</h2>
    <nav class="navigation">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Service</a>
      <a href="#">Contact</a>
      <button class="btn">Login</button>
    </nav>
  </header>
  
</body>
</html>
