<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camra-table</title>
  <style>
    body{
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
      flex-direction: column;
      margin: 0px;
      padding: 0px;
      z-index: 99;
      
    }
    .background-image{
      background-image: url("Gemini_Generated_Image_41yw4x41yw4x41yw.png");
      background-repeat: no-repeat;
      background-size: cover;
      width: 1920px;
      height: 100vh;
      position: fixed;
    }
    .maindiv{
      display: flex;
      flex-direction: row;
      column-gap: 60px;
      border: 1px solid black;
      padding: 120px;
      border-radius: 16px;
      background: transparent;
      backdrop-filter: blur(10px);
      
    }
    .slot,.entry{
      height: 150px;
      width: 180px;
      
      margin-bottom: 0px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      padding: 40px;
      margin-right: 30px;
    }
    .slot,.entry:hover{
      opacity: 0.8;

    }
    .h1{
      color: #E5E6E1;
     
    }
    .cctv{
      height: 200px;
      width: 300px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .cctv:hover{
      opacity: 0.8;
      height: 250px;
      width: 370px;
    }

  </style>
</head>
<body>
  <div class="background-image"></div>
  <div class="maindiv">
    <div class="slot" >
      <img src="CCTV.png" class="cctv">
      <h1 class="h1">CAR&BIKE&nbsp;TABLE</h1>
    </div>
    <div class="entry">
      <img src="table.png" class="cctv">
      <h1 class="h1">STORAGE&nbsp;TABLE</h1>
    </div>
  </div>
  <script>
    
  </script>
</body>
</html>
