<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry-Slot Page</title>
  <style>
    body{
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
      flex-direction: column;
      margin: 0px;
      padding: 0px;
      z-index: 99;
      
    }
    .background-image{
      background-image: url("backgroundvan.png");
      background-repeat: no-repeat;
      background-size: cover;
      width: 1920px;
      height: 100vh;
      position: fixed;
    }
    .maindiv{
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      column-gap: 60px;
      border: 1px solid black;
      padding: 120px;
      border-radius: 16px;
      background: transparent;
      backdrop-filter: blur(8px);
      
    }
    .slot,.entry,.exit{
      height: 150px;
      width: 180px;
      
      margin-bottom: 0px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      padding: 40px;
      margin-right: 30px;
    }
    .h1{
      color: white;
    }
    .slot-img2{
      height: 200px;
      width: 300px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .slot-img2:hover{
      opacity: 0.8;
      height: 250px;
      width: 350px;
    }

  </style>
</head>
<body>
  <div class="background-image"></div>
  <div class="maindiv">
    <div class="slot">
      <img src="slot1.png" class="slot-img2">
      <h1 class="h1">SLOT</h1>
    </div>
    <div class="entry">
      <img src="vanentry.png" class="slot-img2">
      <h1 class="h1">ENTRY</h1>
    </div>
    <div class="entry">
      <img src="vanexit.png" class="slot-img2">
      <h1 class="h1">EXIT</h1>
    </div>
  </div>
  <script>

  </script>
</body>
</html>
